# SPIRE OIDC discovery provider — serves JWT signing keys as a JWKS endpoint
# so Vault's JWT auth method can validate JWT-SVIDs issued by SPIRE.
#
# Serving on plain HTTP (insecure_addr) for the integration test environment.
# In production, replace insecure_addr with addr + TLS configuration.
log_level = "INFO"

# The domain(s) under which the OIDC discovery document will be served.
# Must match the audience the client requests in the JWT-SVID.
domains = ["oidc-provider"]

# Plain HTTP for test-only use.
insecure_addr = "0.0.0.0:8080"

# Connect to the SPIRE server via its admin Unix socket (shared volume).
# The server creates this socket at <data_dir>/private/api.sock.
server_api {
  address       = "unix:///tmp/spire-server/private/api.sock"
  poll_interval = "5s"
}

health_checks {
  bind_port        = "8081"
  ready_check_path = "/ready"
  live_check_path  = "/live"
}
