agent {
  data_dir           = "/tmp/spire-agent"
  log_level          = "INFO"
  server_address     = "spire-server"
  server_port        = 8081
  socket_path        = "/run/spire/agent.sock"
  trust_domain       = "example.org"
  insecure_bootstrap = true  # test-only: skip bundle bootstrap verification
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "memory" {
    plugin_data {}
  }

  # unix workload attestor: identifies callers by UID/GID from /proc.
  # The agent container must run with pid:host so it can resolve host PIDs.
  WorkloadAttestor "unix" {
    plugin_data {}
  }
}

health_checks {
  listener_enabled = true
  bind_address     = "0.0.0.0"
  bind_port        = "8080"
  live_path        = "/live"
  ready_path       = "/ready"
}
