name: Integration Tests

on:
  pull_request:
    branches: [main]
    # Only run when auth0-engine plugin code changes — no need to hit the
    # real Auth0 API for unrelated PRs.
    paths:
      - 'plugins/vault-auth0-engine/**'
      - 'cred-rotation-api/**'
      - 'scripts/phase*.sh'
      - '.github/workflows/integration.yml'

  # Allow manual trigger (e.g. after rotate-root to verify new secret works).
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # needed to post the integration-test comment

jobs:
  # ── vault-auth0-engine integration tests ─────────────────────────────────────
  auth0-engine:
    name: Auth0 engine integration
    runs-on: ubuntu-latest
    # Skip if the required secret is not configured (e.g. forks, Dependabot PRs).
    # The 'if' check prevents the job from failing on PRs from contributors who
    # don't have access to repository secrets.
    if: vars.AUTH0_DOMAIN != ''

    env:
      AUTH0_DOMAIN:           ${{ vars.AUTH0_DOMAIN }}
      AUTH0_MGMT_CLIENT_ID:   ${{ vars.AUTH0_MGMT_CLIENT_ID }}
      AUTH0_MGMT_AUDIENCE:    ${{ vars.AUTH0_MGMT_AUDIENCE }}
      AUTH0_TEST_APP_CLIENT_ID: ${{ vars.AUTH0_TEST_APP_CLIENT_ID }}
      # Secret — only available to trusted contributors and repo owners.
      AUTH0_MGMT_CLIENT_SECRET: ${{ secrets.AUTH0_MGMT_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: plugins/vault-auth0-engine/go.mod

      - name: Start Vault dev server (for Transit tests)
        run: |
          VAULT_VERSION="1.19.4"
          TMP=$(mktemp -d)
          wget -q -O "$TMP/vault.zip" \
            "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          unzip -q "$TMP/vault.zip" -d "$TMP"
          mkdir -p "$HOME/.local/bin"
          cp "$TMP/vault" "$HOME/.local/bin/vault"
          chmod 755 "$HOME/.local/bin/vault"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vault" version

          # Start in dev mode (in-memory, no unseal needed).
          "$HOME/.local/bin/vault" server -dev -dev-root-token-id=root \
            -dev-listen-address=127.0.0.1:8200 &
          sleep 2   # wait for Vault to be ready
          echo "VAULT_ADDR=http://127.0.0.1:8200" >> "$GITHUB_ENV"
          echo "VAULT_TOKEN=root"                 >> "$GITHUB_ENV"

      - name: Enable Transit secrets engine
        run: vault secrets enable transit || true

      - name: Run integration tests
        id: run-tests
        working-directory: plugins/vault-auth0-engine
        run: |
          go test -tags=integration -v -timeout 120s \
            -run TestIntegration \
            ./backend/ 2>&1 | tee /tmp/integration-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post test results as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/integration-output.txt', 'utf8');
            const exitCode = '${{ steps.run-tests.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ PASSED' : '❌ FAILED';
            const sha = context.sha.slice(0, 7);

            const body = [
              `## Integration Test Results — vault-auth0-engine ${status}`,
              ``,
              `**Commit**: \`${sha}\`  **Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ``,
              `Tests call the real Auth0 Management API (tenant: \`${process.env.AUTH0_DOMAIN}\`).`,
              `A passing run is evidence that credential rotation works end-to-end.`,
              ``,
              `<details><summary>Full test output</summary>`,
              ``,
              '```',
              output.slice(0, 60000), // GitHub comment limit guard
              '```',
              `</details>`,
            ].join('\n');

            // Delete any previous integration-test comment from this bot to keep the PR clean.
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments.data) {
              if (comment.user.type === 'Bot' &&
                  comment.body.includes('Integration Test Results — vault-auth0-engine')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail job if tests failed
        if: steps.run-tests.outputs.exit_code != '0'
        run: exit 1

  # ── cred-rotation-api integration tests — auth methods ──────────────────────
  # Tests AppRole and JWT/OIDC auth paths in vault/client.go against a live
  # Vault dev server. No external secrets required — the JWT test uses a
  # self-contained JWKS httptest.Server with an ephemeral ECDSA key.
  # SPIFFE/SPIRE auth is validated by unit tests only (no SPIRE agent in CI).
  cred-rotation-api:
    name: cred-rotation-api integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: cred-rotation-api/go.mod

      - name: Start Vault dev server
        run: |
          VAULT_VERSION="1.19.4"
          TMP=$(mktemp -d)
          wget -q -O "$TMP/vault.zip" \
            "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          unzip -q "$TMP/vault.zip" -d "$TMP"
          mkdir -p "$HOME/.local/bin"
          cp "$TMP/vault" "$HOME/.local/bin/vault"
          chmod 755 "$HOME/.local/bin/vault"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/vault" server -dev -dev-root-token-id=root \
            -dev-listen-address=127.0.0.1:8200 &
          sleep 2
          echo "VAULT_ADDR=http://127.0.0.1:8200" >> "$GITHUB_ENV"
          echo "VAULT_TOKEN=root"                 >> "$GITHUB_ENV"

      - name: Enable required Vault engines
        run: |
          export VAULT_ADDR=http://127.0.0.1:8200
          export VAULT_TOKEN=root
          vault auth enable approle  || true
          vault auth enable jwt      || true

      - name: Run auth method integration tests
        working-directory: cred-rotation-api
        run: |
          go test -tags=integration -race -v -timeout 120s \
            -run 'TestNew_(AppRole|JWT)' \
            ./vault/...

  # ── Splunk HEC token rotation integration tests ───────────────────────────────
  # Uses the official splunk/splunk Docker image — no trial account required.
  # Tests the full rotate → status → revoke lifecycle against a real Splunk REST API.
  splunk-adapter:
    name: Splunk adapter integration
    runs-on: ubuntu-latest

    services:
      splunk:
        image: splunk/splunk:latest
        env:
          SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
          SPLUNK_START_ARGS: --accept-license
          SPLUNK_PASSWORD: changeme123!
        ports:
          - 8089:8089
          - 8088:8088
        options: >-
          --health-cmd "curl -sk -o /dev/null -w '%{http_code}' https://localhost:8089/services/server/info -u admin:changeme123! | grep -q '^2'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: cred-rotation-api/go.mod

      - name: Enable HEC in Splunk
        run: |
          # Enable the HEC global endpoint (disabled by default in Docker image).
          curl -sk -u admin:changeme123! \
            https://localhost:8089/services/data/inputs/http/http \
            -d enableSSL=1 -d disabled=0 -o /dev/null -w "%{http_code}\n"
          sleep 2

      - name: Ensure test output file exists
        if: always()
        run: touch /tmp/splunk-test-output.txt

      - name: Run Splunk adapter integration tests
        id: splunk-tests
        working-directory: cred-rotation-api
        env:
          SPLUNK_BASE_URL: https://localhost:8089
          SPLUNK_AUTH_TOKEN: "admin:changeme123!"
          SPLUNK_INSECURE: "true"
        run: |
          go test -tags=integration -race -v -timeout 180s \
            -run TestSplunk \
            ./adapter/splunk/... 2>&1 | tee /tmp/splunk-test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post Splunk test results as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('/tmp/splunk-test-output.txt')
              ? fs.readFileSync('/tmp/splunk-test-output.txt', 'utf8')
              : '(no output — Splunk container failed to start)';
            const exitCode = '${{ steps.splunk-tests.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ PASSED' : '❌ FAILED';
            const sha = context.sha.slice(0, 7);

            const body = [
              `## Integration Test Results — Splunk HEC adapter ${status}`,
              ``,
              `**Commit**: \`${sha}\`  **Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ``,
              `Tests exercise the full HEC token lifecycle against a \`splunk/splunk\` Docker container:`,
              `rotate → status (active) → rotate-with-delete-old → status (old=inactive) → revoke → status (gone).`,
              ``,
              `<details><summary>Full test output</summary>`,
              ``,
              '```',
              output.slice(0, 60000),
              '```',
              `</details>`,
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments.data) {
              if (comment.user.type === 'Bot' &&
                  comment.body.includes('Integration Test Results — Splunk HEC adapter')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail job if Splunk tests failed
        if: steps.splunk-tests.outputs.exit_code != '0'
        run: exit 1

  # ── GitHub fine-grained PAT rotation integration tests ───────────────────────
  # Requires GITHUB_ADMIN_PAT secret with personal_access_tokens:write permission.
  # Skipped automatically when the secret is absent (forks, Dependabot, etc.).
  # Creates and deletes real PATs on the token owner's GitHub account.
  github-adapter:
    name: GitHub adapter integration
    runs-on: ubuntu-latest
    if: secrets.GITHUB_ADMIN_PAT != ''

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: cred-rotation-api/go.mod

      - name: Run GitHub adapter integration tests
        id: github-tests
        working-directory: cred-rotation-api
        env:
          GITHUB_ADMIN_PAT: ${{ secrets.GITHUB_ADMIN_PAT }}
        run: |
          go test -tags=integration -race -v -timeout 120s \
            -run TestGitHub \
            ./adapter/github/... 2>&1 | tee /tmp/github-test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post GitHub test results as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/github-test-output.txt', 'utf8');
            const exitCode = '${{ steps.github-tests.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ PASSED' : '❌ FAILED';
            const sha = context.sha.slice(0, 7);

            const body = [
              `## Integration Test Results — GitHub PAT adapter ${status}`,
              ``,
              `**Commit**: \`${sha}\`  **Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ``,
              `Tests exercise the full fine-grained PAT lifecycle against the real GitHub API:`,
              `create → status (active) → rotate-with-old-delete → status (old=gone) → revoke → status (gone).`,
              ``,
              `<details><summary>Full test output</summary>`,
              ``,
              '```',
              output.slice(0, 60000),
              '```',
              `</details>`,
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments.data) {
              if (comment.user.type === 'Bot' &&
                  comment.body.includes('Integration Test Results — GitHub PAT adapter')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail job if GitHub tests failed
        if: steps.github-tests.outputs.exit_code != '0'
        run: exit 1

  # ── Datadog API/Application key rotation integration tests ────────────────────
  # Requires DD_ADMIN_API_KEY and DD_ADMIN_APP_KEY secrets with api_keys_write.
  # Skipped automatically when either secret is absent (forks, Dependabot, etc.).
  # Creates and deletes real Datadog API keys against the live Datadog API.
  datadog-adapter:
    name: Datadog adapter integration
    runs-on: ubuntu-latest
    if: secrets.DD_ADMIN_API_KEY != ''

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: cred-rotation-api/go.mod

      - name: Run Datadog adapter integration tests
        id: datadog-tests
        working-directory: cred-rotation-api
        env:
          DD_API_KEY: ${{ secrets.DD_ADMIN_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_ADMIN_APP_KEY }}
        run: |
          go test -tags=integration -race -v -timeout 120s \
            -run TestIntegration \
            ./adapter/datadog/... 2>&1 | tee /tmp/datadog-test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post Datadog test results as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('/tmp/datadog-test-output.txt')
              ? fs.readFileSync('/tmp/datadog-test-output.txt', 'utf8')
              : '(no output)';
            const exitCode = '${{ steps.datadog-tests.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ PASSED' : '❌ FAILED';
            const sha = context.sha.slice(0, 7);

            const body = [
              `## Integration Test Results — Datadog adapter ${status}`,
              ``,
              `**Commit**: \`${sha}\`  **Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ``,
              `Tests exercise the full Datadog API key lifecycle against the live Datadog v2 API:`,
              `rotate → status (active) → rotate-with-old-delete → status (old=gone) → revoke → status (gone).`,
              ``,
              `<details><summary>Full test output</summary>`,
              ``,
              '```',
              output.slice(0, 60000),
              '```',
              `</details>`,
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments.data) {
              if (comment.user.type === 'Bot' &&
                  comment.body.includes('Integration Test Results — Datadog adapter')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail job if Datadog tests failed
        if: steps.datadog-tests.outputs.exit_code != '0'
        run: exit 1
